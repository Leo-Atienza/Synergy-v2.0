# .hackathon/event.yaml — populated 2026-05-15 from kickoff info session + senecahackathon.com
#
# Source of truth for event metadata. /hackathon:* commands read from here.
# Open questions live in docs/seneca-hackathon-context.md (Open Questions section).

name: "Seneca Energy Hackathon 2026"
theme: "energy / sustainability — 'The Energy to Innovate'"
platform: "corporate"                   # Seneca College internal event
event_url: "https://www.senecahackathon.com/"

duration_hours: 72                      # May 24 kickoff (00:00) → May 26 23:59 qualifier-video deadline
start_iso: "2026-05-24T00:00:00-04:00"  # virtual kickoff
deadline_iso: "2026-05-26T23:59:00-04:00"  # qualifier video due — CONFIRMED at kickoff (Opening Day deck slide 9). Supersedes the pre-event "May 28 per website" guess. Build to the earlier deadline regardless — missing it = 0 score.

team:
  mode: team                            # solo | team
  size: 5
  members:                              # name every member on screen in the video (Collaboration axis = 20%)
    - { name: "Cynthia Salazar", role: "Programmer / Marketing" }
    - { name: "Jackson Li", role: "Project Manager / Engineer" }
    - { name: "Roger Lungsee", role: "Automation Engineer" }
    - { name: "Jhonatan", role: "Programmer" }
    - { name: "Leo Atienza", role: "Claude Power User / Researcher" }

judging:
  format: hybrid                        # qualifier video due May 26 -> finalists revealed May 28 -> in-person finale May 30
  rubric:                               # CONFIRMED 5-axis (Opening Day deck slide 27); weights assumed equal pending confirmation
    innovation_creativity: 20
    impact_relevance: 20
    technical_execution: 20
    presentation_communication: 20
    collaboration_teamwork: 20
  sponsor_prizes:                       # CONFIRMED at kickoff (Opening Day deck)
    - "Esri Canada - GIS / ArcGIS, heavily mentored (our map = sponsor-track fit)"
    - "Alectra GRE&T Centre - Peel + GGH grid innovation; community resilience, DER hardening, and candidate hub planning"
  required_tech: []                     # none mandated; real-data required - "AI slop in any form will disqualify" (deck)

submission:
  form_url: ""                          # NOT public. Organizer FAQ (verified 2026-05-26) calls it "the Hackathon Portal" — the link + the FIRM deadline live in the team's registration account / organizer email, NOT on senecahackathon.com. ACTION: pull the portal link before recording wraps; if missing, email hackathon@senecapolytechnic.ca
  required_fields:                      # ASSUMED portal fields (portal not yet seen — confirm on the Hackathon Portal). The video is the primary artifact.
    - description
    - how_it_works
    - inspiration
    - tech_stack
    - video_url
    - screenshots
  max_video_seconds: 300                # HARD 5:00 cap. Organizer FAQ (verified 2026-05-26): "up to 5 minutes", NORMAL playback speed (no speed-ups), anything past 5:00 is NOT evaluated. The pre-event "360s/6-min" note was WRONG — cut to ≤5:00. Deliverable = video, not a deployed app.
  required_video_content:               # per organizer FAQ (2026-05-26) — the video MUST cover:
    - "team introductions + each member's role"   # Collaboration axis (20%) — names on screen
    - "the problem + the proposed solution"
    - "the tech stack, with a demo or walkthrough"
    - "feasibility + unique value proposition"

timeline:                               # RE-BASED 2026-05-25 to the confirmed May 26 23:59 qualifier deadline
  ideate_by: "2026-05-22"               # done; amended 2026-05-25 to Sanctuary, Theme 3 PS2
  scope_locked_by: "2026-05-25T13:55:00-04:00"      # Sanctuary scope amendment locked
  map_built_by: "2026-05-26T12:00:00-04:00"         # ArcGIS HVI + candidate hubs + ranked top five
  demo_moment_working_by: "2026-05-26T16:00:00-04:00" # hero building click + honesty panel + ranked-five reveal
  demo_recorded_by: "2026-05-26T21:00:00-04:00"     # 5-min video - leave buffer before cutoff
  submission_by: "2026-05-26T23:59:00-04:00"        # HARD deadline (qualifier video)
  pitch_practiced_by: "2026-05-29T20:00:00-04:00"   # night before finale (only if finalist)

deploy:
  platform: "vercel"                    # Vercel Hobby (free); project "sanctuary" under team leo-atienzas-projects-0eb755c3, root = sanctuary/web. Deploy is MANUAL (`vercel deploy --prod --yes` from sanctuary/web) — no Git auto-deploy; env-var changes need a redeploy.
  live_url: "https://project-sanctuary-seneca.vercel.app"  # canonical support-showcase URL (judged artifact is the ArcGIS StoryMap video, not this site)
  live_url_alias: "https://sanctuary-phi.vercel.app"        # older alias; 307-redirects to the canonical live_url above; same prod deploy
  deployed_from: "main (manual vercel deploy --prod)" # was feat/showcase-rebuild, now merged to main
  prod_code_commit: "4d84bd0"           # last CODE commit live prod serves (verified 2026-05-27 on project-sanctuary-seneca.vercel.app, deploy dpl_uo7sPPgWYgrQHesAT9fQccvyM2oG READY): /funding HTTP 200 with the full capital-stack content, and 3 in-site /funding links live (nav + read-on card + footer). Adds the /funding page (capital stack: 15% Clean Electricity ITC, the 30% Clean Technology ITC contrast, FCM Green Municipal Fund up to 80%, IESO Save on Energy up to 50%; honesty caveat names the closed NRCan SREPs + federal DMAF) plus the future operating model, the Vision "what improves next" upgrade tracks + cross-link, and a Funding link in Nav + Footer. Prior live: bc002d5 (cross-platform app icons).
  final_commit_sha: ""                  # FREEZE at submission: `git tag v1-submission <sha> && git push origin v1-submission`
  github_url: "https://github.com/Leo-Atienza/Synergy-v2.0"  # private repo — teammates need a collaborator invite (see ONBOARDING.md)

stack_preset: "data-viz"                # ArcGIS StoryMap + Web Map (primary deliverable) + supporting Next.js map in sanctuary/web; locked 2026-05-25 with Sanctuary

