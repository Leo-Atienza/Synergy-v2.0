deploy:
  platform: "vercel"                    # Vercel Hobby (free); project "sanctuary" under team leo-atienzas-projects-0eb755c3, root = sanctuary/web. Deploy is MANUAL (`vercel deploy --prod --yes` from sanctuary/web) — no Git auto-deploy; env-var changes need a redeploy.
  live_url: "https://project-sanctuary-seneca.vercel.app"  # canonical support-showcase URL (judged artifact is the ArcGIS StoryMap video, not this site)
  live_url_alias: "https://sanctuary-phi.vercel.app"        # older alias; 307-redirects to the canonical live_url above; same prod deploy
  deployed_from: "main (manual vercel deploy --prod)" # was feat/showcase-rebuild, now merged to main
  prod_code_commit: "7dfb10e"           # LIVE (deployed + ship-verified 2026-05-30; deploy = sanctuary-qi1ei3jo5 / dpl_34FYjFTKv6yaLERXBhQ2H1HPrQQK READY, aliased to project-sanctuary-seneca.vercel.app): fixes the /map FLOOD layer painting the whole map blue. TRCA's ArcGIS f=geojson floodplain polygons are wound RFC-7946 right-hand-rule (CCW exterior); d3-geo reads winding SPHERICALLY (opposite), so every polygon filled the whole sphere -> a flat blue wash. Fix flips each polygon component (exterior + its holes together, preserving relative winding) whenever d3's own geoArea says it encloses >hemisphere; scripts/fetch-flood.mjs hardened so future refetches self-correct, and the committed public/peel-flood.geojson rewound offline with identical logic (no TRCA refetch). Verified: all 6 routes HTTP 200; deployed peel-flood.geojson sha256 == local (0589f57); /map layer composition intact + flood now IN-FRAME (282 heat tracts, 282 winter, 295 flood maxAbs ~650 not ~100000+, 87 facilities, 10 pins, 5 rings). Tag v2-finalist-live-0530 still at 726f539 (bug-fix increment, tag not moved). Prior live CODE: 62b18a1 (body-copy follow-up + multi-hazard UI/judge-facing copy, built on 726f539), 01cbdbe (panel symmetry + footer, tagged v2-finalist-live), c07393a (multi-hazard finalist, tagged v2-multi-hazard-finalist).
  final_commit_sha: "c07393a"           # FROZEN finalist-REVEAL build, tagged v2-multi-hazard-finalist (pushed) — kept as the historical marker of the build that qualified us. The polished build now LIVE for the in-person finale is prod_code_commit above (01cbdbe), tagged v2-finalist-live. Earlier qualifier freeze guidance: `git tag v1-submission <sha>`.
  github_url: "https://github.com/Leo-Atienza/Synergy-v2.0"  # private repo — teammates need a collaborator invite (see ONBOARDING.md)

stack_preset: "data-viz"                # ArcGIS StoryMap + Web Map (primary deliverable) + supporting Next.js map in sanctuary/web; locked 2026-05-25 with Sanctuary

