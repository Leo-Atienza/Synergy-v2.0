<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tide — one screen, one verb</title>
  <style>
    :root {
      --bg: #0b1722; --ink: #eaf2f7; --muted: #6f8aa0;
      --teal: #0E7D77;     /* Bruce nuclear — clean + cheap */
      --blue: #1E5F8C;     /* Lake Ontario — mid */
      --peak: #C84B1F;     /* gas peaker — pricey + dirty */
    }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--ink);
      font: 16px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
      min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: min(560px, 100%); }
    .verb { font-size: clamp(56px, 14vw, 104px); font-weight: 800; letter-spacing: -2px; line-height: 1; }
    .verb.go { color: var(--teal); }
    .verb.wait { color: var(--muted); }
    .sub { color: var(--muted); margin-top: 8px; font-size: 18px; }
    .price { font-variant-numeric: tabular-nums; color: var(--ink); }
    .strip { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; margin: 28px 0 6px; height: 86px; align-items: end; }
    .strip > div { border-radius: 3px 3px 0 0; position: relative; }
    .strip .now { outline: 2px solid var(--ink); outline-offset: 2px; }
    .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .tally { margin-top: 24px; padding-top: 18px; border-top: 1px solid #1d2c3a; display: flex; gap: 28px; }
    .tally b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
    .tally span { color: var(--muted); font-size: 13px; }
    input[type=range] { width: 100%; margin-top: 18px; accent-color: var(--teal); }
    .foot { margin-top: 14px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div id="verb" class="verb wait">WAIT</div>
    <div class="sub" id="sub"></div>

    <div class="strip" id="strip"></div>
    <div class="axis"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>11p</span></div>

    <div class="tally">
      <div><b id="saved">$0.00</b><span>saved tonight vs charging now</span></div>
      <div><b id="co2">0.00 kg</b><span>CO&#8322; avoided</span></div>
    </div>

    <input type="range" id="scrub" min="0" max="23" value="18" />
    <div class="foot">Drag to move through the day. Load: EV charger, plugged in 6pm, done by 7am. Demo fixture = Ontario summer weekday, ULO plan.</div>
  </main>

  <script>
    // ULO weekday $/kWh and a representative summer carbon curve (gCO2/kWh).
    const PRICE = [.039,.039,.039,.039,.039,.039,.039,.157,.157,.157,.157,.157,.157,.157,.157,.157,.391,.391,.391,.391,.391,.157,.157,.039];
    const CO2   = [51,48,47,45,47,52,60,74,83,89,94,95,97,99,103,110,120,130,135,134,126,110,87,68];
    // Tide's chosen overnight window for this load (from the optimizer): 23:00–05:00.
    const WINDOW = new Set([23,0,1,2,3,4]);
    const colorFor = p => p >= .39 ? 'var(--peak)' : p <= .04 ? 'var(--teal)' : 'var(--blue)';

    const strip = document.getElementById('strip');
    const bars = PRICE.map((p,h) => {
      const d = document.createElement('div');
      d.style.background = colorFor(p);
      d.style.height = (18 + CO2[h]/135*68) + '%';
      d.title = `${String(h).padStart(2,'0')}:00 — $${p.toFixed(3)}/kWh, ${CO2[h]} gCO2/kWh`;
      strip.appendChild(d); return d;
    });

    // Baseline: charging straight through from 6pm for 6h.
    const baseHours = [18,19,20,21,22,23];
    const baseCost = baseHours.reduce((s,h)=>s + 1.44*PRICE[h], 0);
    const baseCo2  = baseHours.reduce((s,h)=>s + 1.44*CO2[h], 0)/1000;

    function render(h) {
      bars.forEach((b,i)=>b.classList.toggle('now', i===h));
      const go = WINDOW.has(h);
      const verb = document.getElementById('verb');
      verb.textContent = go ? 'GO NOW' : 'WAIT';
      verb.className = 'verb ' + (go ? 'go' : 'wait');
      document.getElementById('sub').innerHTML =
        `${String(h).padStart(2,'0')}:00 &middot; <span class="price">$${PRICE[h].toFixed(3)}/kWh</span> &middot; ${CO2[h]} gCO&#8322;/kWh` +
        (go ? ' &middot; cheapest + cleanest' : ` &middot; ${PRICE[h] >= .39 ? 'the priciest hours — hold off' : 'wait for overnight'}`);

      // Savings accrue only over the chosen window the scrubber has passed.
      const ran = [...WINDOW].filter(w => (w >= 23 ? w-24 : w) <= (h >= 23 ? h-24 : h) && w !== 23 || (w===23 && h>=23));
      const passed = [23,0,1,2,3,4].filter(w => orderIndex(w) <= orderIndex(h) && WINDOW.has(w));
      const cost = passed.reduce((s,w)=>s+1.44*PRICE[w],0);
      const co2 = passed.reduce((s,w)=>s+1.44*CO2[w],0)/1000;
      // saved = what the baseline would have spent on the same number of kWh, minus what Tide spent
      const frac = passed.length / 6;
      document.getElementById('saved').textContent = '$' + Math.max(0, baseCost*frac - cost).toFixed(2);
      document.getElementById('co2').textContent = Math.max(0, baseCo2*frac - co2).toFixed(2) + ' kg';
    }
    // order the overnight window 23->4 along a single axis for the "passed" check
    function orderIndex(h){ return h >= 18 ? h-18 : h+6; }

    const scrub = document.getElementById('scrub');
    scrub.addEventListener('input', () => render(+scrub.value));
    render(+scrub.value);
  </script>
</body>
</html>
